services:
  postgres:
    image: postgres:16-alpine
    container_name: sc-pne-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sc_pne
      POSTGRES_USER: sc_pne
      POSTGRES_PASSWORD: sc_pne_local
    ports:
      # Solo loopback: sin IP, Docker publica en todas las interfaces y la
      # contraseña de dev está en el repo.
      - "127.0.0.1:5434:5432"
    volumes:
      - sc_pne_pg:/var/lib/postgresql/data

volumes:
  sc_pne_pg:
