name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sc_pne
          POSTGRES_USER: sc_pne
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sc_pne"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # La misma imagen que producción: si download.sh no verifica el sha256 de
      # algún modelo, el build (y el CI) falla.
      - name: Build backend image
        run: docker build -t sc-pne-backend ./backend
      - name: Tests (dentro de la imagen, contra Postgres)
        run: >-
          docker run --rm --network host --entrypoint python
          -e DJANGO_DEBUG=True -e DB_HOST=localhost -e DB_PORT=5432 -e DB_PASSWORD=ci_password
          sc-pne-backend manage.py test asistencia --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx ng test --watch=false
      # Build de producción + nginx del Dockerfile real.
      - name: Build frontend image
        run: docker build -t sc-pne-frontend .
      - name: nginx -t
        run: docker run --rm --add-host backend:127.0.0.1 sc-pne-frontend nginx -t
