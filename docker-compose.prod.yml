# Nombre de proyecto propio: en la misma carpeta que docker-compose.yml (dev),
# compartían "asistencia" y un `down` de uno se llevaba contenedores del otro.
name: asistencia-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: sc-pne-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./scripts/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - backups_prod:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - media_files:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /admin/login/ responde 200 cuando migrate/collectstatic terminaron y
      # gunicorn atiende (Host localhost: va en DJANGO_ALLOWED_HOSTS).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/admin/login/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  nginx:
    build: ./frontend
    ports:
      - "80:80"
      # - "443:443"  # descomentar junto con el bloque HTTPS de frontend/nginx.conf
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  pg_data_prod:
  backups_prod:
  media_files:
  certbot_certs:
  certbot_webroot:
