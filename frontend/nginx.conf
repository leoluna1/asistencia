# Fuerza bruta contra el login del admin: DRF no throttlea /admin/ (no es una
# vista DRF). Límite nativo de nginx por IP real.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

# DNS interno de Docker, re-resuelto cada 10 s: con un host fijo en proxy_pass,
# nginx resolvía "backend" una sola vez al arrancar — no levantaba si el backend
# todavía no existía, y tras redeployar solo el backend (IP nueva) daba 502.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    set $backend_upstream http://backend:8000;
    # Fotos de registro/verificación: el backend rechaza >5 MB (MAX_BYTES_FOTO);
    # esto corta antes de que el archivo entero llegue a gunicorn.
    client_max_body_size 6m;

    root /usr/share/nginx/html;
    index index.html;

    # Desafío HTTP-01 de certbot: tiene que funcionar ANTES de que exista el
    # certificado, o sea en este bloque :80, no solo en el HTTPS comentado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca cacheado: tras un redeploy, uno viejo pedía bundles con
    # hash que ya no existen y try_files devolvía HTML en su lugar (pantalla en
    # blanco). Los bundles con hash sí se cachean (nombre nuevo en cada build).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|admin|static)/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}

