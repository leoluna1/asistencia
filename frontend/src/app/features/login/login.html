<div class="pantalla">
  <mat-card appearance="outlined" class="tarjeta">
    <h2>Ingresar al sistema</h2>

    <mat-form-field appearance="outline">
      <mat-label>Usuario (cédula si sos postulante)</mat-label>
      <input matInput [(ngModel)]="username" (keyup.enter)="ingresar()" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" [(ngModel)]="password" (keyup.enter)="ingresar()" />
    </mat-form-field>

    @if (error()) {
      <app-mensaje tipo="error">{{ error() }}</app-mensaje>
    }

    <button mat-flat-button color="primary" [disabled]="cargando()" (click)="ingresar()">
      @if (cargando()) {
        <mat-progress-spinner diameter="18" mode="indeterminate" />
      } @else {
        Ingresar
      }
    </button>
  </mat-card>
</div>
