<div class="camara">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <div class="visor">
      <video #video autoplay playsinline muted></video>
      <div class="guia" [class.ajustar]="!!aviso()" aria-hidden="true"></div>
      @if (listo()) {
        <div class="estado" [class.ajustar]="!!aviso()">
          <mat-icon>{{ aviso() ? 'warning_amber' : 'center_focus_weak' }}</mat-icon>
          <span>{{ aviso() ?? 'Buscando buen encuadre…' }}</span>
        </div>
      }
    </div>
    <p class="ayuda">
      Quítate lentes, gorra o cualquier cosa que cubra tu rostro. Centra tu rostro
      dentro del óvalo, mirando de frente.
    </p>
    <button mat-stroked-button [disabled]="!listo()" (click)="capturarAhora()">
      <mat-icon>photo_camera</mat-icon>
      Capturar ahora
    </button>
  }
  <canvas #canvas hidden></canvas>
</div>
